<h2>Neue Aufgabe erstellen</h2>
<div>
  <mat-form-field appearance="outline" class="full-width">
    <input matInput placeholder="Aufgabenname" [(ngModel)]="taskName" />
  </mat-form-field>
</div>
<div>
  <mat-form-field appearance="outline" class="full-width">
    <textarea matInput placeholder="Aufgabentext" [(ngModel)]="taskText"></textarea>
  </mat-form-field>
</div>
<div>
  <input type="file" multiple (change)="onFileSelected($event)" />
</div>
<div style="margin-top: 20px;">
  <button mat-raised-button color="primary" (click)="createTask()">Erstellen</button>
  <button mat-raised-button color="warn" (click)="cancel()">Abbrechen</button>
</div>
