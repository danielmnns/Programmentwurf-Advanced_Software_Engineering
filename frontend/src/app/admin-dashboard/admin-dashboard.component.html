<div class="course-container">
  <div *ngFor="let course of courses" class="course-box">
    <div class="course-content">
      <span 
        class="course-title" 
        (click)="navigateToCourse(course.title)"
      >
        {{ course.title }}
      </span>
      
      <!-- Container für Stift- und Mülleimer-Icons -->
      <div class="icon-container">
        <!-- Stift-Icon zur Admin-Kurs-Seite -->
        <span 
          class="edit-icon" 
          (click)="navigateToAdminKurs(course.title)" 
          title="Kurs bearbeiten"
        >
          ✏️
        </span>
        
        <!-- Mülleimer-Icon zum Löschen des Kurses -->
        <span 
          class="delete-icon" 
          (click)="deleteCourse(course.title)" 
          title="Kurs löschen"
        >
          🗑️
        </span>
      </div>
    </div>
  </div>
</div>

<!-- Button nur für Admin sichtbar -->
<div *ngIf="isAdmin">
  <button (click)="navigateToUserVerwaltung()">Zur User-Verwaltung</button>
</div>
