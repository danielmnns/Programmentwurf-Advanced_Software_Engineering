<div class="courses">
  <!-- Verwaltungsbuttons nur für Administratoren sichtbar -->
  <div *ngIf="isAdmin" class="user-management-container">
    <!-- Button zum Hinzufügen eines neuen Kurses -->
    <button 
      class="button-standard" 
      (click)="openAddCourseModal()"
    >
      ➕ {{ 'addCourse' | translate }}
    </button>
    
    <!-- Button zur Benutzerverwaltungsseite -->
    <button 
      class="button-standard" 
      (click)="navigateToUserVerwaltung()"
    >
      👥 {{ 'userManagement' | translate }}
    </button>
  </div>

  <div class="course-list">
    <div *ngFor="let course of courses" class="course-content" (click)="navigateToCourse(course.title)" style="cursor: pointer;">
      <h3>{{ course.title }}</h3>
      
      <!-- Container für die Bearbeitungs- und Lösch-Icons -->
      <div class="icon-container">
        <!-- Bearbeitungs-Icon für die Weiterleitung zur Admin-Kursansicht -->
        <span 
          class="edit-icon" 
          (click)="navigateToAdminKurs(course.title); $event.stopPropagation();" 
          title="{{ 'edit' | translate }}"
        >
          ✏️
        </span>
        
        <!-- Lösch-Icon zum Entfernen des Kurses -->
        <span 
          class="delete-icon" 
          (click)="showDeleteConfirmationPopup(course); $event.stopPropagation();" 
          title="{{ 'delete' | translate }}"
        >
          🗑️
        </span>
      </div>
    </div>
  </div>
</div>

<!-- Modal-Dialog zum Hinzufügen eines neuen Kurses -->
<div class="modal" *ngIf="showAddCourseModal">
  <div class="modal-content">
    <h3>{{ 'addCourse' | translate }}</h3>
    <input
      type="text"
      [(ngModel)]="newCourseTitle"
      placeholder="{{ 'courseName' | translate }}"
      class="course-input"
    />
    <div class="modal-buttons">
      <button (click)="addCourse()">{{ 'submit' | translate }}</button>
      <button class="cancel-button" (click)="closeAddCourseModal()">{{ 'cancel' | translate }}</button>
    </div>
  </div>
</div>

<!-- Erfolgsmeldung nach dem Erstellen eines Kurses -->
<div class="success-popup" *ngIf="showSuccessPopup">
  ✅ {{ 'courseCreatedSuccess' | translate }}
</div>

<!-- Fehlermeldung bei Problemen -->
<div class="error-popup" *ngIf="showErrorPopup">
  ❌ {{ errorMessage }}
</div>

<!-- Bestätigungsdialog vor dem Löschen eines Kurses -->
<div class="confirmation-popup" *ngIf="showDeleteConfirmation">
  <p>{{ 'confirmDeleteCourse' | translate }}</p>
  <div class="confirmation-buttons">
    <button (click)="confirmDeleteCourse()">{{ 'yes' | translate }}</button>
    <button class="cancel-button" (click)="cancelDeleteCourse()">{{ 'no' | translate }}</button>
  </div>
</div>
