<div class="login-container">
  <h2>{{ 'changePassword' | translate }}</h2>
  <form (ngSubmit)="changePassword()">
    <div class="form-group">
      <label for="username">{{ 'username' | translate }}</label>
      <input
        type="text"
        id="username"
        [value]="userName"
        readonly
        class="form-control"
      />
    </div>
    <div class="form-group">
      <label for="old-password">{{ 'oldPassword' | translate }}</label>
      <input
        type="password"
        id="old-password"
        [(ngModel)]="oldPassword"
        name="oldPassword"
        class="form-control"
        required
      />
    </div>
    <div class="form-group">
      <label for="new-password">{{ 'newPassword' | translate }}</label>
      <input
        type="password"
        id="new-password"
        [(ngModel)]="newPassword"
        name="newPassword"
        class="form-control"
        required
      />
    </div>
    <button type="submit" class="btn btn-primary">{{ 'changePassword' | translate }}</button>
  </form>
  <button
    class="btn btn-secondary"
    style="margin-top: 10px;"
    (click)="logout()"
  >
    {{ 'logout' | translate }}
  </button>
</div>
