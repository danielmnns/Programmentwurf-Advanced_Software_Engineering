<div class="account-container">
    <h2>Konto verwalten</h2>
  
    <form (ngSubmit)="onChangePassword()" #passwordForm="ngForm">
      <div class="form-group">
        <label for="oldPassword">Altes Passwort</label>
        <input
          type="password"
          id="oldPassword"
          name="oldPassword"
          class="form-control"
          [(ngModel)]="oldPassword"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="newPassword">Neues Passwort</label>
        <input
          type="password"
          id="newPassword"
          name="newPassword"
          class="form-control"
          [(ngModel)]="newPassword"
          required
        />
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="!passwordForm.valid">
        Passwort ändern
      </button>
    </form>
  
    <button class="btn btn-secondary logout-btn" (click)="onLogout()">Abmelden</button>
  </div>
