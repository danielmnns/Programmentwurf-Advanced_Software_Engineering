<div class="account-container">
  <h2>{{ 'accountSettings' | translate }}</h2>
  
  <!-- Success/Error Alerts would go here -->
  <div *ngIf="successMessage" class="alert alert-success">
    <span class="alert-icon">✓</span>
    <span>{{ successMessage }}</span>
  </div>
  
  <div *ngIf="errorMessage" class="alert alert-error">
    <span class="alert-icon">⚠️</span>
    <span>{{ errorMessage }}</span>
  </div>

  <form (ngSubmit)="changePassword()">
    <div class="form-group">
      <label for="username">{{ 'username' | translate }}</label>
      <input
        type="text"
        id="username"
        [value]="userName"
        readonly
        class="form-control"
      />
    </div>
    
    <div class="form-group">
      <label for="old-password">{{ 'oldPassword' | translate }}</label>
      <input
        type="password"
        id="old-password"
        [(ngModel)]="oldPassword"
        name="oldPassword"
        class="form-control"
        required
      />
    </div>
    
    <div class="form-group">
      <label for="new-password">{{ 'newPassword' | translate }}</label>
      <input
        type="password"
        id="new-password"
        [(ngModel)]="newPassword"
        name="newPassword"
        class="form-control"
        required
      />
      
      <!-- Password strength indicators could go here -->
      <div *ngIf="newPassword" class="password-requirements">
        {{ 'passwordRequirements' | translate }}:
        <ul>
          <li>{{ 'minCharacters' | translate }}</li>
          <li>{{ 'includeUppercase' | translate }}</li>
          <li>{{ 'includeNumber' | translate }}</li>
          <li>{{ 'includeSpecial' | translate }}</li>
        </ul>
      </div>
    </div>
    
    <div class="buttons-container">
      <button type="submit" class="btn btn-primary">
        {{ 'changePassword' | translate }}
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        (click)="logout()"
      >
        {{ 'logout' | translate }}
      </button>
    </div>
  </form>
</div>
