<!-- Header -->
<div class="header">
    <div class="home-icon" (click)="navigateToHome()">🏠</div>
    <div class="date-time">
      <p>📅 {{ currentDate }} &nbsp; ⏰ {{ currentTime }}</p>
    </div>
    <div class="user-section">
      <span class="icon">🔔</span>
      <span class="icon">💬<span class="badge">1</span></span>
      <span class="language">🌍 Deutsch (de) ▼</span>
      <div class="user-info" (click)="navigateToAccount()">
        <p>{{ userName }}</p>
        <div class="benutzer-icon">👤</div>
      </div>
    </div>
  </div>
  
  <!-- Kursliste -->
  <div class="kurse-container">
    <h2>Kursübersicht</h2>
    <ul>
      <li *ngFor="let kurs of kurse">
        <span>{{ kurs.name }}</span>
        <span class="loeschen-icon" (click)="oeffneLoeschPopup(kurs.id)">🗑️</span>
      </li>
    </ul>
  </div>
  
  <!-- Popup für Kurslöschung -->
  <div class="popup" *ngIf="showDeletePopup">
    <div class="popup-content">
      <h3>Kurs löschen</h3>
      <p>Möchtest du diesen Kurs wirklich löschen?</p>
      <button (click)="kursLoeschen()">Ja</button>
      <button (click)="abbrechenLoeschen()">Nein</button>
    </div>
  </div>
