<!-- Kopfleiste mit Navigation und Benutzerinformationen -->
<div class="header">
  <div class="home">
    <mat-icon class="home-icon" (click)="navigateToHome()">home</mat-icon>
  </div>

  <div class="session-timer" *ngIf="isLoggedIn && timerActive">
    <div class="timer-container" [ngClass]="{'warning': isTimerWarning}">
      <mat-icon class="timer-icon">timer</mat-icon>
      <span class="timer-text">{{ 'sessionTimeout' | translate }}: {{ remainingTime }}</span>
    </div>
  </div>

  <div class="user-section">
    <!-- Sprachauswahl-Menü -->
    <div class="language">
      <button mat-button [matMenuTriggerFor]="languageMenu" class="lang-button">
        <mat-icon>language</mat-icon>
        <span>{{ getLanguageLabel() }}</span>
        <span class="flag">{{ getLanguageFlag() }}</span>
      </button>
      <mat-menu #languageMenu="matMenu">
        <button mat-menu-item (click)="changeLanguage('de')">
          {{ 'german' | translate }} 🇩🇪
        </button>
        <button mat-menu-item (click)="changeLanguage('en')">
          {{ 'english' | translate }} 🇬🇧
        </button>
      </mat-menu>
    </div>

    <!-- Benutzerinformationen und Account-Navigation -->
    <div class="user-info" (click)="navigateToAccount()">
      <div class="user-text">
        <span class="user-type">{{ (userType || 'defaultUserType') | translate }}</span>
        <span class="username">{{ userName }}</span>
      </div>
      <mat-icon class="benutzer-icon">account_circle</mat-icon>
    </div>
  </div>
</div>
