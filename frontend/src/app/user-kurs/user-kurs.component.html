<!-- src/app/user-kurs/user-kurs.component.html -->
<div class="container">
  <div class="users">
    <h2>
      {{ courseName }}
      <span
        class="edit-icon"
        *ngIf="isAuthorized"
        (click)="navigateToAdminCourse(courseName)"
        title="Kurs bearbeiten"
      >
        ✏️
      </span>
    </h2>
    <ul>
      <!-- Beschreibung -->
      <li *ngIf="textContent">
        <mat-card>
          <mat-card-title>Beschreibung</mat-card-title>
          <mat-card-content>
            <p>{{ textContent }}</p>
          </mat-card-content>
        </mat-card>
      </li>

      <!-- Kurs-Dokumente -->
      <li *ngIf="uploadedFiles.documents.length">
        <mat-card>
          <mat-card-title>Dokumente</mat-card-title>
          <mat-card-content>
            <ul>
              <li *ngFor="let file of uploadedFiles.documents">
                <a [href]="file.url" target="_blank">{{ file.name }}</a>
                <button (click)="openPdfPreview(file.url)" class="preview-button">Vorschau</button>
              </li>
            </ul>
          </mat-card-content>
        </mat-card>
      </li>

      <!-- Aufgabenbereich: Nur ein Link pro Aufgabe -->
      <li *ngFor="let task of tasks">
        <mat-card class="task-card">
          <mat-card-title>
            <a (click)="openTask(task)" style="cursor: pointer;">{{ task.name }}</a>
          </mat-card-title>
        </mat-card>
      </li>

      <!-- Allgemeiner Abgabebereich
      <li>
        <mat-card>
          <mat-card-title>Abgabefeld</mat-card-title>
          <mat-card-content>
            <input type="file" accept="application/pdf" (change)="handleFileUpload($event, 'abgaben')" />
            <ul>
              <li *ngFor="let file of uploadedFiles.abgaben; let i = index">
                <a [href]="file.url" target="_blank">{{ file.name }}</a>
                <div class="file-actions">
                  <button (click)="openPdfPreview(file.url)" class="preview-button">Vorschau</button>
                  <button (click)="confirmDeletion('abgaben', i)" class="delete-button" aria-label="Datei löschen bestätigen">✖</button>
                </div>
              </li>
            </ul>
          </mat-card-content>
        </mat-card>
      </li>
    -->

      <!-- Allgemeines Feedback
      <li *ngIf="feedbackContent">
        <mat-card>
          <mat-card-title>Feedback</mat-card-title>
          <mat-card-content>
            <p>{{ feedbackContent }}</p>
          </mat-card-content>
        </mat-card>
      </li>
    -->
    </ul>

    <!-- PDF-Vorschau Modal -->
    <div *ngIf="showPdfPreview" class="pdf-preview">
      <div class="pdf-container">
        <button class="close-button" (click)="showPdfPreview = false">✖</button>
        <iframe [src]="currentPdfUrl" width="100%" height="100%"></iframe>
      </div>
    </div>
  </div>

  <div class="teilnehmer">
    <h2>Teilnehmer</h2>
    <ul>
      <li *ngFor="let participant of participants">{{ participant }}</li>
    </ul>
  </div>
</div>

<!-- Bestätigungsdialog -->
<div *ngIf="showConfirmationDialog" class="confirmation-dialog">
  <div class="dialog-content">
    <p>Möchten Sie die Datei "{{ fileToDelete?.name }}" wirklich löschen?</p>
    <div class="dialog-actions">
      <button (click)="deleteFile()" class="confirm-btn">Bestätigen</button>
      <button (click)="cancelDeletion()" class="cancel-btn">Abbrechen</button>
    </div>
  </div>
</div>
