<!-- src/app/user-kurs/user-kurs.component.html -->
<div class="container">
  <div class="users">
    <h2>
      {{ courseName }}
      <span
        class="edit-icon"
        *ngIf="isAuthorized"
        (click)="navigateToAdminCourse(courseName)"
        title="{{ 'edit' | translate }}"
      >
        ✏️
      </span>
    </h2>
    <ul>
      <!-- Beschreibung -->
      <li *ngIf="textContent">
        <mat-card>
          <mat-card-title>{{ 'courseDescription' | translate }}</mat-card-title>
          <mat-card-content>
            <p>{{ textContent }}</p>
          </mat-card-content>
        </mat-card>
      </li>

      <!-- Kurs-Dokumente -->
      <li *ngIf="uploadedFiles.documents.length">
        <mat-card>
          <mat-card-title>{{ 'materials' | translate }}</mat-card-title>
          <mat-card-content>
            <ul>
              <li *ngFor="let file of uploadedFiles.documents">
                <!-- Debug-Informationen -->
                <!-- <div style="font-size: 11px; color: #666; margin-bottom: 5px;">
                  URL: {{file.originalUrl}}
                </div> -->
                
                <!-- Korrigierter Link, der immer auf das PDF zeigt -->
                <a [href]="file.url" target="_blank">{{ file.name }}</a>
                <button (click)="openPdfPreview(file.originalUrl || file.url)" class="preview-button">{{ 'preview' | translate }}</button>
              </li>
            </ul>
          </mat-card-content>
        </mat-card>
      </li>

      <!-- Aufgabenbereich: Nur ein Link pro Aufgabe -->
      <li *ngFor="let task of tasks">
        <mat-card class="task-card">
          <mat-card-title>
            <a (click)="openTask(task)" style="cursor: pointer;">{{ task.name }}</a>
          </mat-card-title>
        </mat-card>
      </li>
    </ul>

    <!-- PDF-Vorschau Modal -->
    <div *ngIf="showPdfPreview" class="pdf-preview">
      <div class="pdf-container">
        <button class="close-button" (click)="showPdfPreview = false">✖</button>
        <iframe [src]="currentPdfUrl" width="100%" height="100%"></iframe>
      </div>
    </div>
  </div>

  <div class="teilnehmer">
    <h2>{{ 'participants' | translate }}</h2>
    <ul>
      <li *ngFor="let participant of participants">{{ participant }}</li>
    </ul>
  </div>
</div>

<!-- Bestätigungsdialog -->
<div *ngIf="showConfirmationDialog" class="confirmation-dialog">
  <div class="dialog-content">
    <p>{{ 'deleteConfirm' | translate }} "{{ fileToDelete?.name }}"?</p>
    <div class="dialog-actions">
      <button (click)="deleteFile()" class="confirm-btn">{{ 'confirm' | translate }}</button>
      <button (click)="cancelDeletion()" class="cancel-btn">{{ 'cancel' | translate }}</button>
    </div>
  </div>
</div>
