<div class="container">
  <!-- Hauptbereich (Kursinhalt) -->
  <div class="users">
    <h2>
      {{ courseName }}
      <!-- Stift-Icon -->
      <span 
        class="edit-icon" 
        *ngIf="isAuthorized"
        (click)="navigateToAdminCourse(courseName)" 
        title="Kurs bearbeiten" 
      >
        ✏️
      </span>
    </h2>
    <ul>

      <!-- Text-Anzeige -->
<li *ngIf="textContent">
  <mat-card>
    <mat-card-title>Text</mat-card-title>
    <mat-card-content>
      <p>{{ textContent }}</p>
    </mat-card-content>
  </mat-card>
</li>


      <!-- Dokumente-Anzeige -->
      <li *ngIf="uploadedFiles.documents.length">
        <mat-card>
          <mat-card-title>Dokumente</mat-card-title>
          <mat-card-content>
            <ul>
              <li *ngFor="let file of uploadedFiles.documents">
                <a [href]="file.url" target="_blank">{{ file.name }}</a>
              </li>
            </ul>
          </mat-card-content>
        </mat-card>
      </li>

      <!-- Aufgaben-Anzeige -->
      <li *ngIf="uploadedFiles.aufgaben.length">
        <mat-card>
          <mat-card-title>Aufgaben</mat-card-title>
          <mat-card-content>
            <ul>
              <li *ngFor="let file of uploadedFiles.aufgaben">
                <a [href]="file.url" target="_blank">{{ file.name }}</a>
              </li>
            </ul>
          </mat-card-content>
        </mat-card>
      </li>

      <!-- Abgabefeld -->
      <li>
        <mat-card>
          <mat-card-title>Abgabefeld</mat-card-title>
          <mat-card-content>
            <input type="file" accept="application/pdf" (change)="handleFileUpload($event, 'abgaben')" />
            <ul>
              <li *ngFor="let file of uploadedFiles.abgaben">
                <a [href]="file.url" target="_blank">{{ file.name }}</a>
              </li>
            </ul>
          </mat-card-content>
        </mat-card>
      </li>

      <!-- Feedback-Anzeige -->
      <li *ngIf="feedbackContent">
        <mat-card>
          <mat-card-title>Feedback</mat-card-title>
          <mat-card-content>
            <p>{{ feedbackContent }}</p>
          </mat-card-content>
        </mat-card>
      </li>
    </ul>
  </div>

  <!-- Teilnehmerliste -->
  <div class="teilnehmer">
    <h2>Teilnehmer</h2>
    <ul>
      <li *ngFor="let participant of participants">
        {{ participant }}
      </li>
    </ul>
  </div>
</div>
