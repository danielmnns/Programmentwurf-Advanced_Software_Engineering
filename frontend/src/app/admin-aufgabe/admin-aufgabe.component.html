<div class="admin-task-container">
    <!-- Zurück-Button -->
    <div class="back-button-container">
      <button class="back-button" (click)="navigateBack()" [attr.aria-label]="'back' | translate">
        {{ 'back' | translate }}
      </button>
    </div>

    <h1>{{ taskName }}</h1>
    <p>{{ taskDescription }}</p>

    <!-- Aufgabendateien anzeigen -->
    <div class="task-documents" *ngIf="uploadedDocuments && uploadedDocuments.length > 0">
      <h3>Aufgabendokumente</h3>
      <ul class="document-list">
        <li *ngFor="let document of uploadedDocuments">
          <a [href]="document.url" target="_blank" class="document-link">
            <span class="document-icon">📄</span>
            {{ document.name }}
          </a>
        </li>
      </ul>
    </div>

    <div class="submissions-list">
      <h3>{{ 'userFees' | translate}}</h3>
      <div *ngIf="submissions.length === 0" class="no-submissions">
        <p>Bisher wurden keine Abgaben eingereicht.</p>
      </div>
      <div class="submission-item" *ngFor="let submission of submissions">
        <p><strong>Benutzer:</strong> {{ submission.userName }}</p>
        <div *ngIf="submission.file">
          <p>
            <a [href]="submission.fileUrl" target="_blank">{{ submission.fileName }}</a>
          </p>
        </div>
        <div *ngIf="!submission.file" class="no-file">
          <p>Keine Datei abgegeben</p>
        </div>
        <div class="feedback-input">
          <textarea [(ngModel)]="submission.feedbackText" placeholder="Feedback eingeben..."></textarea>
          <button class="btn-save" (click)="saveFeedback(submission)">Speichern</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Benachrichtigungs-Popup (Toast-Style) -->
  <div class="notification" *ngIf="showNotification">
    <div class="notification-content">
      <p>{{ notificationMessage }}</p>
      <button (click)="closeNotification()">Schließen</button>
    </div>
  </div>
