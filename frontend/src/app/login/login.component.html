<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ 'login' | translate }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <!-- Info Message Box -->
      <div *ngIf="infoMessage" class="info-message-box">
        <span class="message-icon">ℹ️</span>
        <p>{{ infoMessage }}</p>
      </div>

      <!-- Error Message Box -->
      <div *ngIf="loginFailed" class="error-message-box">
        <span class="message-icon">⚠️</span>
        <p>{{ errorMessage }}</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>{{ 'username' | translate }}</mat-label>
          <input matInput type="text" [(ngModel)]="username" name="username" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>{{ 'password' | translate }}</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required />
        </mat-form-field>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit"
          [disabled]="!loginForm.valid || isLoading" 
          class="submit-button"
          [class.loading-button]="isLoading"
        >
          <span *ngIf="!isLoading">{{ 'submit' | translate }}</span>
          <span *ngIf="isLoading" class="loading-text">{{ 'submitting' | translate }}</span>
          <span *ngIf="isLoading" class="loading-spinner"></span>
        </button>
      </form>

      <!-- Language Selector -->
      <div class="language-selector">
        <button 
          class="language-btn" 
          [class.active]="languageService.getCurrentLanguage() === 'de'"
          (click)="languageService.setLanguage('de')"
        > Deutsch </button>
        <button 
          class="language-btn" 
          [class.active]="languageService.getCurrentLanguage() === 'en'"
          (click)="languageService.setLanguage('en')"
        > English </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
