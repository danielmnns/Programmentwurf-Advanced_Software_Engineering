<div class="login-container">
  <!-- Sprache ändern Dropdown -->
  <div class="language-switch">
    <select [(ngModel)]="selectedLanguage" (change)="changeLanguage(selectedLanguage)">
      <option value="de">Deutsch</option>
      <option value="en">Englisch</option>
    </select>
  </div>

  <!-- Login-Formular -->
  <h2>Anmeldung</h2>
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="form-group">
      <label for="username">Benutzername</label>
      <input
        type="text"
        id="username"
        name="username"
        class="form-control"
        [(ngModel)]="username"
        required
      />
    </div>
    <div class="form-group">
      <label for="password">Passwort</label>
      <input
        type="password"
        id="password"
        name="password"
        class="form-control"
        [(ngModel)]="password"
        required
      />
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="!loginForm.valid">
      Anmelden
    </button>
  </form>

  <!-- Registrieren-Button -->
  <button class="btn btn-secondary" (click)="onRegister()">
    Registrieren
  </button>
</div>
